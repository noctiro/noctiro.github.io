<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跳转界面 | Noctiro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #fafafa 0%, #f5f5f5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 背景光晕 */
        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 245, 240, 0.6) 0%, transparent 70%);
            top: -250px;
            right: -250px;
            border-radius: 50%;
            animation: float 10s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(245, 245, 245, 0.8) 0%, transparent 70%);
            bottom: -200px;
            left: -200px;
            border-radius: 50%;
            animation: float 8s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }

        .glass-card {
            position: relative;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 32px;
            padding: 80px 60px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 1);
            max-width: 540px;
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-size: 56px;
            font-weight: 600;
            letter-spacing: -2px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #1a1a1a 0%, #4a4a4a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            font-size: 17px;
            color: #666;
            font-weight: 400;
            line-height: 1.5;
            margin-bottom: 40px;
        }

        a {
            color: #1a1a1a;
            text-decoration: none;
            padding-bottom: 2px;
            border-bottom: 1px solid #d0d0d0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        a:hover {
            color: #000;
            border-bottom-color: #666;
        }

        /* 进度指示器 */
        .progress-container {
            width: 200px;
            height: 3px;
            background: rgba(0, 0, 0, 0.08);
            border-radius: 2px;
            overflow: hidden;
            margin: 0 auto;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #2a2a2a 0%, #1a1a1a 100%);
            border-radius: 2px;
            animation: loading 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes loading {
            from { width: 0%; }
            to { width: 100%; }
        }

        /* 响应式 */
        @media (max-width: 640px) {
            .glass-card {
                padding: 60px 40px;
                margin: 20px;
            }
            
            h1 {
                font-size: 42px;
            }
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <h1>Noctiro</h1>
        <p>正在跳转至 <a href="https://www.noctiro.moe">noctiro.moe</a></p>
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                window.location.href = "https://www.noctiro.moe";
            }, 2000);
        });
    </script>
</body>
</html>
